name: Hustler

options:
  minimumXcodeGenVersion: "2.38.0"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  bundleIdPrefix: com.hustler

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  HustlerCore:
    path: HustlerCore

targets:
  Hustler:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Hustler
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hustler.hq
        PRODUCT_NAME: Hustler
        INFOPLIST_FILE: Hustler/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: HustlerCore
        product: HustlerCore
      - package: HustlerCore
        product: HustlerArchive

schemes:
  Hustler:
    build:
      targets:
        Hustler: all
    run:
      config: Debug
    archive:
      config: Release
